name: Gource visualization

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gource
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_opts: >-
            --max-files 1000
            --key
            -800x600
            --highlight-users
            --filename-time 3
            --output-framerate 25
            -s 0.6
            --multi-sampling
            --auto-skip-seconds 0.1
            --stop-at-end
            --hide mouse,progress

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Upscale + re-encode
        run: |
          ffmpeg -y -i ./gource/gource.mp4 \
            -c:v libx264 -crf 19 -level 3.1 -preset slow -tune film \
            -filter:v "scale=-2:720" -sws_flags lanczos \
            -c:a aac -b:a 128k -movflags +faststart \
            ./gource.mp4

      - name: Generate thumbnail
        run: |
          ffmpeg -y -ss 3 -i ./gource/gource.mp4 -frames:v 1 -q:v 2 gource/gource.png

      - name: Commit gource video + thumbnail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gource.mp4 gource/gource.png
          git diff --staged --quiet || git commit -m "ci: add gource visualization (automated)"
          git push
